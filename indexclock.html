<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Digital Clock</title>
</head>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);

    overflow:hidden;
}

.container{

    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;

}

.clock{

    width:650px;

    padding:40px;

    text-align:center;

    border-radius:25px;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);

    box-shadow:
    0 0 30px rgba(0,255,255,.2),
    inset 0 0 20px rgba(255,255,255,.08);

}

.clock h2{

    color:white;

    font-size:30px;

    letter-spacing:3px;

    margin-bottom:30px;

    text-transform:uppercase;

}

.time{

    display:flex;

    justify-content:center;

    align-items:flex-end;

    gap:12px;

    flex-wrap:wrap;

}

.time span{

    color:#00F5FF;

    font-size:80px;

    font-weight:bold;

    text-shadow:
    0 0 15px cyan,
    0 0 30px cyan;

}

.colon{

    color:white !important;

}

#ampm{

    font-size:30px;

    margin-left:15px;

    color:#FFD700;

    text-shadow:0 0 15px gold;

}

.date{

    margin-top:30px;

    color:white;

    font-size:24px;

    letter-spacing:2px;

}

.clock{

    animation:glow 3s infinite alternate;

}

@keyframes glow{

    from{

        box-shadow:
        0 0 20px cyan;

    }

    to{

        box-shadow:
        0 0 45px #00ffff,
        0 0 70px #00ffff;

    }

}

@media(max-width:700px){

.time span{

    font-size:55px;

}

#ampm{

    font-size:24px;

}

.clock{

    width:95%;

    padding:25px;

}

.date{

    font-size:18px;

}

}
</style>

<body>

<div class="container">

    <div class="clock">

        <h2>Digital Clock</h2>

        <div class="time">

            <span id="hour">00</span>

            <span class="colon">:</span>

            <span id="minute">00</span>

            <span class="colon">:</span>

            <span id="second">00</span>

            <span id="ampm">AM</span>

        </div>

        <div id="date" class="date"></div>

    </div>

</div>

<script>
    const hour = document.getElementById("hour");
const minute = document.getElementById("minute");
const second = document.getElementById("second");
const ampm = document.getElementById("ampm");
const date = document.getElementById("date");

const days = [
    "Sunday",
    "Monday",
    "Tuesday",
    "Wednesday",
    "Thursday",
    "Friday",
    "Saturday"
];

const months = [
    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"
];

function updateClock(){

    const now = new Date();

    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();

    ampm.textContent = ["AM","PM"][Number(h >= 12)];

    h = h % 12 || 12;

    hour.textContent = String(h).padStart(2,"0");
    minute.textContent = String(m).padStart(2,"0");
    second.textContent = String(s).padStart(2,"0");

    date.textContent =
    `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`;

}

updateClock();

setInterval(updateClock,1000);
</script>

</body>
</html>
